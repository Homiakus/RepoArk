name: Control Plane PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: repoark
          POSTGRES_DB: repoark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repoark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REPOARK_TEST_DATABASE_URL: postgres://postgres:repoark@127.0.0.1:5432/repoark?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: SQLite and PostgreSQL integration tests
        run: go test -tags=integration ./internal/controlplane -count=1 -v
