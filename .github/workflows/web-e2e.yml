name: Web Console E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build RepoArk
        run: go build -trimpath -o repoark ./cmd/repoark

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Run real-browser smoke tests
        shell: bash
        env:
          REPOARK_E2E_URL: http://127.0.0.1:19787
          REPOARK_E2E_ARTIFACTS: artifacts/web-e2e
        run: |
          set -euo pipefail
          mkdir -p artifacts/web-e2e "$RUNNER_TEMP/repoark-e2e"
          cat > "$RUNNER_TEMP/repoark-e2e/config.yml" <<EOF
          version: 8
          backup:
            root: $RUNNER_TEMP/repoark-e2e/backups
          security:
            require_verification: false
            sign_manifests: false
          audit:
            enabled: false
          cas:
            enabled: false
          policy:
            enabled: false
            require_signed_manifest: false
          observability:
            enabled: true
            listen: 127.0.0.1:19787
          control_plane:
            enabled: false
          EOF

          ./repoark --config "$RUNNER_TEMP/repoark-e2e/config.yml" web > artifacts/web-e2e/server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:19787/api/v1/console/session > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then
            echo "RepoArk web console did not become ready"
            cat artifacts/web-e2e/server.log
            exit 1
          fi

          node e2e/web-console-smoke.mjs

      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: repoark-web-e2e-diagnostics
          path: artifacts/web-e2e/
          if-no-files-found: ignore
          retention-days: 14
