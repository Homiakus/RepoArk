name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source checksum inventory
        shell: bash
        run: |
          bash scripts/generate-source-checksums.sh > /tmp/SOURCE_SHA256SUMS.current.txt
          if ! cmp -s /tmp/SOURCE_SHA256SUMS.current.txt SOURCE_SHA256SUMS.txt; then
            echo "::error::SOURCE_SHA256SUMS.txt is missing or stale. Regenerate it only from a fully verified source tree."
            echo "----- BEGIN CURRENT SOURCE_SHA256SUMS.txt -----"
            cat /tmp/SOURCE_SHA256SUMS.current.txt
            echo "----- END CURRENT SOURCE_SHA256SUMS.txt -----"
            if [[ -f SOURCE_SHA256SUMS.txt ]]; then
              diff -u SOURCE_SHA256SUMS.txt /tmp/SOURCE_SHA256SUMS.current.txt || true
            fi
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Verify module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: make test-race
      - name: Build
        run: go build -trimpath -o repoark ./cmd/repoark

  cross-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: repoark-linux-amd64
          - os: windows-latest
            artifact: repoark-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Build
        shell: bash
        run: go build -trimpath -o "${{ matrix.artifact }}" ./cmd/repoark
