name: Recover Go Modules

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate canonical module files
        run: go mod tidy
      - name: Upload module files
        uses: actions/upload-artifact@v4
        with:
          name: repoark-go-modules
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 1
